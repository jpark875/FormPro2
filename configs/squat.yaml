# FormPro2 configuration: barbell back squat.
# Every tunable lives here. Modules take a config object and never hardcode numbers.

exercise: barbell_back_squat

camera:
  source: 0            # device index, or a path/URL string to replay a file
  width: 1280
  height: 720
  fps: 30
  backend: auto        # auto | dshow | msmf | v4l2 | ffmpeg
  warmup_frames: 5     # discarded while the sensor settles exposure and white balance
  read_timeout_s: 2.0
  pace_file_playback: true   # false to batch-process a file at full decode speed

pose:
  variant: heavy       # lite | full | heavy. heavy is the most accurate in Z
  model_dir: models
  min_detection_confidence: 0.6
  min_presence_confidence: 0.6
  min_tracking_confidence: 0.6

  # A joint below this is treated as unmeasured rather than trusted, and findings that
  # depend on it are withheld instead of derived from a hallucinated coordinate.
  min_visibility: 0.5

  smoothing:
    enabled: true
    # One-Euro. Higher beta reduces lag on fast reps; higher min_cutoff reduces jitter
    # in a held position.
    min_cutoff: 1.2
    beta: 0.35
    d_cutoff: 1.0

kinematics:
  # Depth attenuation for angle measurement only: 1.0 is a true 3D angle, 0.0 is
  # projected onto the image plane. Segment lengths always use full 3D.
  z_weight: 0.6

  # Camera-near side resolution. A larger hysteresis makes the side harder to flip.
  side_ema_alpha: 0.15
  side_hysteresis_m: 0.02

  # Rolling window for segment-length calibration. At 30 fps, 150 frames is about 5 s
  # and 45 frames about 1.5 s before proportions are first reported.
  calibration_window_frames: 150
  calibration_min_frames: 45

  # The camera-far side is partially occluded at 45 degrees, so it contributes at
  # reduced weight rather than equally or not at all.
  camera_far_weight: 0.35

  # Severity equivalence for the one dimensionless feature: 15 degrees per 0.1 of ratio,
  # a scale factor of 150. Stated as an equivalence so the claim is reviewable.
  width_ratio_equivalent_degrees: 15.0
  width_ratio_equivalent_delta: 0.1

phases:
  velocity_window_ms: 150
  max_gap_ms: 250

  # Leg-lengths per second, so one threshold set covers every body size.
  move_velocity: 0.15
  still_velocity: 0.06

  # Hip height as a fraction of leg length: about 1.0 standing, about 0.5 at depth.
  standing_height: 0.95
  descended_height: 0.90

  # Consecutive frames a transition must hold before it commits.
  min_dwell_frames: 3

analyzer:
  # Percentiles of the corpus's optimal-form frames that define the acceptable band.
  # These select which evidence counts as normal; no bound is written here, since every
  # bound is computed from the corpus at runtime.
  band_low_percentile: 5.0
  band_high_percentile: 95.0
  min_band_samples: 8

  # Covers pose-estimator jitter, not biomechanical judgement. Larger values suppress
  # findings on reps that measure close to the band edge.
  noise_allowance_deg: 2.0

  finding_hold_frames: 4
  finding_decay_frames: 10

  dtw_band_ratio: 0.2
  min_confidence_margin: 0.12

dataset:
  root: data/reference
  expected_exercise: barbell_back_squat
  accepted_camera_angles: ["45_oblique_anterior"]
  legacy_camera_angles: ["45_oblique"]
  max_timestamp_gap_ms: 250
  min_ratio_span: 0.15
